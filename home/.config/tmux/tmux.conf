
set -g prefix C-f
bind C-f send-prefix

# Workmux sidebar
bind C-t run-shell "workmux sidebar"

# Terminal
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",foot:Tc"
set -g terminal-features "foot:clipboard"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",alacritty:Tc"
set -ga terminal-overrides ",wezterm:Tc"
set -ga terminal-overrides ",xterm-256color:Tc"

# Clipboard
set -g set-clipboard on

# Mouse
set -g mouse on

# History
set -g history-limit 10000

# Indexing
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Timing
set -sg escape-time 0

# Focus
set -g focus-events on

# Status bar (Catppuccin Mocha)
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left " #[bold,fg=#cba6f7]#S #[fg=#45475a]│ "
set -g status-right " #{?client_key_table,#[fg=#89dceb]TABLE:#{client_key_table} ,}#{?client_prefix,#[fg=#cba6f7]LEADER ,}#[fg=#f9e2af]#(date '+%H:%M') "
set -g status-right-length 60
set -g window-status-style "fg=#6c7086,bg=#1e1e2e"
set -g window-status-format " #I:#W "
set -g window-status-current-style "bold,fg=#cba6f7,bg=#313244"
set -g window-status-current-format " #I:#W "
set -g window-status-activity-style "fg=#fab387,bg=#1e1e2e"
set -g window-status-separator " "
set -g status-position top

# Pane borders (Catppuccin Mocha)
set -g pane-border-status top
set -g pane-border-format "#{?pane_title,#{pane_title},}"
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#1e1e2e,bg=#cba6f7,bold"
set -g window-style "bg=#11111b"
set -g window-active-style "bg=#1e1e2e"

# Vi mode
setw -g mode-keys vi
setw -g monitor-activity on
set -g visual-activity off

# Reload config
bind R source-file ~/.config/tmux/tmux.conf \; display "tmux reloaded"

# Unbind defaults
unbind C-d
unbind -T prefix H
unbind -T prefix J
unbind -T prefix K
unbind -T prefix L

# Resize mode
bind r switch-client -T resize
bind -T resize h resize-pane -L 10
bind -T resize j resize-pane -D 10
bind -T resize k resize-pane -U 10
bind -T resize l resize-pane -R 10
bind -T resize Escape switch-client -T root
bind -T resize C-f switch-client -T root

# Splits
bind '\' split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane management
bind o select-pane -t:.+
bind x confirm-before kill-pane
bind f resize-pane -Z
bind s display-panes
bind t choose-tree -w
bind [ copy-mode
bind ] paste-buffer
bind e command-prompt -I "#W" "rename-window '%%'"
bind & confirm-before -p "kill-window? (y/n)" kill-window
bind , command-prompt -I "#{pane_title}" "select-pane -T '%%'"

# Copy mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Window navigation (no prefix)
bind-key -n C-Tab next-window
bind-key -n C-S-Tab previous-window
bind-key -n C-S-Left swap-window -d -t -1
bind-key -n C-S-Right swap-window -d -t +1

# Plugin settings
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes '~nvim -> nvim'
set -g @resurrect-strategy-nvim 'session'

# Sessionizer
bind C-f run-shell 'tmux-sessionizer'

run '~/.tmux/plugins/tpm/tpm'

# Interactive restore: pick a saved resurrect snapshot with fzf.
bind C-r display-popup -E -w 80% -h 60% "tmux-restore-picker"
